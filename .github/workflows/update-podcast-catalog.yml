name: Refresh podcast catalog

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-podcast-catalog.yml"
      - "scripts/update_podcast_catalog.py"
      - "scripts/download_podcast.py"
      - "tests/test_update_podcast_catalog.py"
      - "tests/test_download_podcast.py"

permissions:
  contents: write

concurrency:
  group: podcast-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test podcast row parser
        run: python -m unittest discover -s tests -v

      - name: Fetch and parse latest episodes
        run: python scripts/update_podcast_catalog.py

      - name: Publish updated catalog
        run: |
          if git diff --quiet -- podcast-catalog.json site/podcast-catalog.json; then
            echo "Podcast catalog is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add podcast-catalog.json site/podcast-catalog.json
          git commit -m "Refresh latest podcast catalog"
          git push
